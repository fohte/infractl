[package]
name = "infractl"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
kube = { version = "=4.2.0", default-features = false, features = [
  "client",
  "ring",
  "rustls-tls",
  "ws",
] }
self_update = { version = "=0.44.0", features = ["reqwest", "rustls", "compression-flate2"], default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
tokio-postgres = "=0.7.18"

[dev-dependencies]
indoc = "=2.0.7"
rstest = "=0.26.1"
temp-env = "=0.3.6"
tempfile = "=3.27.0"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_macros = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
