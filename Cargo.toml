[package]
name = "infractl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.4", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "=0.9.34"
thiserror = "=2.0.18"

[dev-dependencies]
indoc = "=2.0.7"
rstest = "=0.26.1"
temp-env = "=0.3.6"
tempfile = "=3.27.0"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_macros = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
